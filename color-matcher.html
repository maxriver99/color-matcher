<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对色工具 - Color Matcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #F5F5F3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        
        .ceramic-shadow {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.12);
        }
        
        .color-preview {
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .pantone-swatch {
            border-radius: 12px;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .pantone-swatch:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .camera-container {
            border: 2px solid #E5E5E3;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: #000;
        }
        
        .camera-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .focus-box {
            width: 60px;
            height: 60px;
            border: 2px solid white;
            border-radius: 8px;
            opacity: 0.8;
        }
        
        .camera-btn {
            background: white;
            border: 1px solid #E5E5E3;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .camera-btn:hover {
            background: #F8F8F6;
            border-color: #D5D5D3;
            transform: translateY(-1px);
        }
        
        .camera-btn:active {
            transform: translateY(0);
        }
        
        .camera-btn svg {
            width: 18px;
            height: 18px;
            stroke: #666;
            stroke-width: 2;
            fill: none;
        }
        
        input[type="range"] {
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: #E5E5E3;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            border: 1px solid #D5D5D3;
        }
        
        input[type="number"],
        input[type="text"] {
            background: white;
            border: 1px solid #E5E5E3;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        input[type="number"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #B5B5B3;
            box-shadow: 0 0 0 3px rgba(181, 181, 179, 0.1);
        }
        
        @media (max-width: 768px) {
            .mobile-stack {
                flex-direction: column;
            }
        }
    </style>
</head>

                    </div>
                </div>
                
                <hr class="my-8 border-gray-200">
                
                <!-- CMYK 输入 -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">C</label>
                        <input type="number" id="cmyk-c" min="0" max="100" value="0" class="w-full">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">M</label>

                    </div>

                    </div>

                        <label class="text-xs text-gray-500 block mb-1">K</label>

                    </div>
                </div>

                    </div>
                </div>
            </div>

        ];

        // DOM元素
        const rgbR = document.getElementById('rgb-r');
        const rgbG = document.getElementById('rgb-g');
        const rgbB = document.getElementById('rgb-b');
        const rgbRValue = document.getElementById('rgb-r-value');
        const rgbGValue = document.getElementById('rgb-g-value');
        const rgbBValue = document.getElementById('rgb-b-value');
        
        const cmykC = document.getElementById('cmyk-c');
        const cmykM = document.getElementById('cmyk-m');
        const cmykY = document.getElementById('cmyk-y');
        const cmykK = document.getElementById('cmyk-k');
        
        const hexInput = document.getElementById('hex');
        const mainColorPreview = document.getElementById('main-color-preview');
        
        const pantoneColor = document.getElementById('pantone-color');
        const pantoneNumber = document.getElementById('pantone-number');
        const pantoneName = document.getElementById('pantone-name');

        // 颜色转换函数
        function rgbToHex(r, g, b) {
            return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? [
                parseInt(result[1], 16),
                parseInt(result[2], 16),
                parseInt(result[3], 16)
            ] : null;
        }

        function rgbToCmyk(r, g, b) {
            r /= 255;
            g /= 255;
            b /= 255;
            
            const k = 1 - Math.max(r, g, b);
            const c = k === 1 ? 0 : (1 - r - k) / (1 - k);
            const m = k === 1 ? 0 : (1 - g - k) / (1 - k);
            const y = k === 1 ? 0 : (1 - b - k) / (1 - k);
            
            return [
                Math.round(c * 100),
                Math.round(m * 100),
                Math.round(y * 100),
                Math.round(k * 100)
            ];
        }

        function cmykToRgb(c, m, y, k) {
            c /= 100;
            m /= 100;
            y /= 100;
            k /= 100;
            
            const r = 255 * (1 - c) * (1 - k);
            const g = 255 * (1 - m) * (1 - k);
            const b = 255 * (1 - y) * (1 - k);
            
            return [
                Math.round(r),
                Math.round(g),
                Math.round(b)
            ];
        }

        // Delta E算法（简化版欧几里得距离）
        function calculateDeltaE(rgb1, rgb2) {
            const dr = rgb1[0] - rgb2[0];
            const dg = rgb1[1] - rgb2[1];
            const db = rgb1[2] - rgb2[2];
            return Math.sqrt(dr * dr + dg * dg + db * db);
        }

        // 查找最接近的潘通色
        function findClosestPantone(rgb) {
            let closestColor = pantoneColors[0];
            let minDistance = calculateDeltaE(rgb, closestColor.rgb);
            
            for (const color of pantoneColors) {
                const distance = calculateDeltaE(rgb, color.rgb);
                if (distance< minDistance) {
                    minDistance = distance;
                    closestColor = color;
                }
            }
            
            return closestColor;
        }

        // 更新颜色显示
        function updateColorDisplay(r, g, b) {
            const hex = rgbToHex(r, g, b);
            const cmyk = rgbToCmyk(r, g, b);
            
            // 更新主颜色预览
            mainColorPreview.style.backgroundColor = hex;
            
            // 更新RGB显示
            rgbRValue.textContent = r;
            rgbGValue.textContent = g;
            rgbBValue.textContent = b;
            
            // 更新CMYK输入
            cmykC.value = cmyk[0];
            cmykM.value = cmyk[1];
            cmykY.value = cmyk[2];
            cmykK.value = cmyk[3];
            
            // 更新HEX输入
            hexInput.value = hex;
            
            // 查找并显示最接近的潘通色
            const closestPantone = findClosestPantone([r, g, b]);
            pantoneColor.style.backgroundColor = rgbToHex(closestPantone.rgb[0], closestPantone.rgb[1], closestPantone.rgb[2]);
            pantoneNumber.textContent = closestPantone.number;
            pantoneName.textContent = closestPantone.name;
        }

        // 事件监听器
        rgbR.addEventListener('input', () => {
            const r = parseInt(rgbR.value);
            const g = parseInt(rgbG.value);
            const b = parseInt(rgbB.value);
            updateColorDisplay(r, g, b);
        });

        rgbG.addEventListener('input', () => {
            const r = parseInt(rgbR.value);
            const g = parseInt(rgbG.value);
            const b = parseInt(rgbB.value);
            updateColorDisplay(r, g, b);
        });

        rgbB.addEventListener('input', () => {
            const r = parseInt(rgbR.value);
            const g = parseInt(rgbG.value);
            const b = parseInt(rgbB.value);
            updateColorDisplay(r, g, b);
        });

        cmykC.addEventListener('input', () => {
            const c = parseInt(cmykC.value) || 0;
            const m = parseInt(cmykM.value) || 0;
            const y = parseInt(cmykY.value) || 0;
            const k = parseInt(cmykK.value) || 0;
            const rgb = cmykToRgb(c, m, y, k);
            rgbR.value = rgb[0];
            rgbG.value = rgb[1];
            rgbB.value = rgb[2];
            updateColorDisplay(rgb[0], rgb[1], rgb[2]);
        });

        cmykM.addEventListener('input', () => {
            const c = parseInt(cmykC.value) || 0;
            const m = parseInt(cmykM.value) || 0;
            const y = parseInt(cmykY.value) || 0;
            const k = parseInt(cmykK.value) || 0;
            const rgb = cmykToRgb(c, m, y, k);
            rgbR.value = rgb[0];
            rgbG.value = rgb[1];
            rgbB.value = rgb[2];
            updateColorDisplay(rgb[0], rgb[1], rgb[2]);
        });

        cmykY.addEventListener('input', () => {
            const c = parseInt(cmykC.value) || 0;
            const m = parseInt(cmykM.value) || 0;
            const y = parseInt(cmykY.value) || 0;
            const k = parseInt(cmykK.value) || 0;
            const rgb = cmykToRgb(c, m, y, k);
            rgbR.value = rgb[0];
            rgbG.value = rgb[1];
            rgbB.value = rgb[2];
            updateColorDisplay(rgb[0], rgb[1], rgb[2]);
        });

        cmykK.addEventListener('input', () => {
            const c = parseInt(cmykC.value) || 0;
            const m = parseInt(cmykM.value) || 0;
            const y = parseInt(cmykY.value) || 0;
            const k = parseInt(cmykK.value) || 0;
            const rgb = cmykToRgb(c, m, y, k);
            rgbR.value = rgb[0];
            rgbG.value = rgb[1];
            rgbB.value = rgb[2];
            updateColorDisplay(rgb[0], rgb[1], rgb[2]);
        });

        hexInput.addEventListener('input', () => {
            const hex = hexInput.value;
            const rgb = hexToRgb(hex);
            if (rgb) {
                rgbR.value = rgb[0];
                rgbG.value = rgb[1];
                rgbB.value = rgb[2];
                updateColorDisplay(rgb[0], rgb[1], rgb[2]);
            }
        });

        // 复制潘通色号功能
        pantoneColor.addEventListener('click', () => {
            const colorNumber = pantoneNumber.textContent;
            navigator.clipboard.writeText(colorNumber).then(() => {
                // 显示复制成功提示
                const originalText = pantoneName.textContent;
                pantoneName.textContent = '已复制！';
                setTimeout(() => {
                    pantoneName.textContent = originalText;
                }, 1500);
            });
        });

        // 相机吸色功能
        function startCamera() {
            // 优先使用后置摄像头
            const constraints = {
                video: {
                    facingMode: { exact: 'environment' }
                }
            };
            
            navigator.mediaDevices.getUserMedia(constraints)
                .then(s => {
                    stream = s;
                    cameraVideo.srcObject = stream;
                    cameraContainer.classList.remove('hidden');
                    cameraBtn.innerHTML = `
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                        关闭相机
                    `;
                })
                .catch(err => {
                    console.error('无法访问摄像头:', err);
                    // 如果后置摄像头不可用，尝试默认摄像头
                    navigator.mediaDevices.getUserMedia({ video: true })
                        .then(s => {
                            stream = s;
                            cameraVideo.srcObject = stream;
                            cameraContainer.classList.remove('hidden');
                            cameraBtn.innerHTML = `
                                <svg viewBox="0 0 24 24">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                                </svg>
                                关闭相机
                            `;
                        })
                        .catch(err2 => {
                            console.error('无法访问任何摄像头:', err2);
                            alert('无法访问摄像头，请检查权限设置');
                        });
                });
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            cameraContainer.classList.add('hidden');
            cameraBtn.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                开启相机吸色
            `;
        }

        function captureColor() {
            const videoWidth = cameraVideo.videoWidth;
            const videoHeight = cameraVideo.videoHeight;
            
            cameraCanvas.width = videoWidth;
            cameraCanvas.height = videoHeight;
            
            const ctx = cameraCanvas.getContext('2d');
            ctx.drawImage(cameraVideo, 0, 0, videoWidth, videoHeight);
            
            // 获取画面中心的颜色
            const centerX = Math.floor(videoWidth / 2);
            const centerY = Math.floor(videoHeight / 2);
            
            const pixelData = ctx.getImageData(centerX, centerY, 1, 1).data;
            const r = pixelData[0];
            const g = pixelData[1];
            const b = pixelData[2];
            
            // 更新颜色显示
            rgbR.value = r;
            rgbG.value = g;
            rgbB.value = b;
            updateColorDisplay(r, g, b);
            
            // 显示捕获成功提示
            const originalText = cameraBtn.innerHTML;
            cameraBtn.innerHTML = '<span>颜色已捕获！</span>';
            setTimeout(() => {
                cameraBtn.innerHTML = originalText;
            }, 1500);
        }

        // 相机按钮点击事件
        cameraBtn.addEventListener('click', () => {
            if (stream) {
                stopCamera();
            } else {
                startCamera();
            }
        });

        // 捕获颜色按钮点击事件
        captureBtn.addEventListener('click', captureColor);

        // 初始化
        updateColorDisplay(255, 255, 255);
    </script>
