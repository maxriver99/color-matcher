<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对色工具 - Color Matcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #F5F5F3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        
        .ceramic-shadow {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.12);
        }
        
        .color-preview {
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .pantone-swatch {
            border-radius: 12px;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .pantone-swatch:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .camera-container {
            border: 2px solid #E5E5E3;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: #000;
        }
        
        .camera-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .focus-box {
            width: 60px;
            height: 60px;
            border: 2px solid white;
            border-radius: 8px;
            opacity: 0.8;
        }
        
        .camera-btn {
            background: white;
            border: 1px solid #E5E5E3;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .camera-btn:hover {
            background: #F8F8F6;
            border-color: #D5D5D3;
            transform: translateY(-1px);
        }
        
        .camera-btn:active {
            transform: translateY(0);
        }
        
        .camera-btn svg {
            width: 18px;
            height: 18px;
            stroke: #666;
            stroke-width: 2;
            fill: none;
        }
        
        .error-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #DC2626;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
            z-index: 1000;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .error-toast.show {
            opacity: 1;
        }
        
        .permission-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .permission-modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .permission-modal h3 {
            margin: 0 0 12px 0;
            font-size: 18px;
            color: #333;
        }
        
        .permission-modal p {
            margin: 0 0 24px 0;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .permission-modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        
        .permission-btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        
        .permission-btn.primary {
            background: #3B82F6;
            color: white;
        }
        
        .permission-btn.primary:hover {
            background: #2563EB;
        }
        
        .permission-btn.secondary {
            background: #F3F4F6;
            color: #333;
        }
        
        .permission-btn.secondary:hover {
            background: #E5E7EB;
        }
        
        .color-system-btn {
            background: #F3F4F6;
            color: #6B7280;
            border: 1px solid #E5E7EB;
            transition: all 0.2s ease;
        }
        
        .color-system-btn:hover {
            background: #E5E7EB;
            color: #4B5563;
        }
        
        .color-system-btn.active {
            background: #3B82F6;
            color: white;
            border-color: #3B82F6;
        }
        
        input[type="range"] {
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: #E5E5E3;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            border: 1px solid #D5D5D3;
        }
        
        input[type="number"],
        input[type="text"] {
            background: white;
            border: 1px solid #E5E5E3;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        input[type="number"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #B5B5B3;
            box-shadow: 0 0 0 3px rgba(181, 181, 179, 0.1);
        }
        
        @media (max-width: 768px) {
            .mobile-stack {
                flex-direction: column;
            }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl md:text-4xl font-light text-gray-800 mb-2">对色工具</h1>
            <p class="text-gray-600 text-sm">Color Matcher</p>
        </header>
        
        <div class="flex flex-col md:flex-row gap-8 mobile-stack">
            <!-- 左侧：参数调节 -->
            <div class="flex-1 bg-white rounded-2xl p-6 md:p-8 ceramic-shadow">
                <h2 class="text-lg font-medium text-gray-800 mb-6">颜色参数</h2>
                
                <!-- 相机吸色功能 -->
                <div class="mb-8">
                    <button id="camera-btn" class="camera-btn mb-4">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                        开启相机吸色
                    </button>
                    
                    <!-- 相机容器 -->
                    <div id="camera-container" class="camera-container ceramic-shadow hidden">
                        <video id="camera-video" autoplay playsinline class="w-full h-auto" style="max-height: 300px;"></video>
                        <canvas id="camera-canvas" class="hidden"></canvas>
                        <div class="camera-overlay">
                            <div class="focus-box"></div>
                        </div>
                        <div class="mt-4 flex justify-center">
                            <button id="capture-btn" class="camera-btn">捕获颜色</button>
                        </div>
                    </div>
                </div>
                
                <!-- RGB 滑块 -->
                <div class="space-y-6">
                    <div>
                        <div class="flex justify-between mb-2">
                            <label class="text-sm text-gray-600">R</label>
                            <span id="rgb-r-value" class="text-sm font-medium text-gray-800">255</span>
                        </div>
                        <input type="range" id="rgb-r" min="0" max="255" value="255" class="w-full">
                    </div>
                    
                    <div>
                        <div class="flex justify-between mb-2">
                            <label class="text-sm text-gray-600">G</label>
                            <span id="rgb-g-value" class="text-sm font-medium text-gray-800">255</span>
                        </div>
                        <input type="range" id="rgb-g" min="0" max="255" value="255" class="w-full">
                    </div>
                    
                    <div>
                        <div class="flex justify-between mb-2">
                            <label class="text-sm text-gray-600">B</label>
                            <span id="rgb-b-value" class="text-sm font-medium text-gray-800">255</span>
                        </div>
                        <input type="range" id="rgb-b" min="0" max="255" value="255" class="w-full">
                    </div>
                </div>
                
                <hr class="my-8 border-gray-200">
                
                <!-- CMYK 输入 -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">C</label>
                        <input type="number" id="cmyk-c" min="0" max="100" value="0" class="w-full">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">M</label>
                        <input type="number" id="cmyk-m" min="0" max="100" value="0" class="w-full">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">Y</label>
                        <input type="number" id="cmyk-y" min="0" max="100" value="0" class="w-full">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">K</label>
                        <input type="number" id="cmyk-k" min="0" max="100" value="0" class="w-full">
                    </div>
                </div>
                
                <!-- HEX 输入 -->

                    <input type="text" id="hex" value="#FFFFFF" class="w-full font-mono">

                            <button class="color-system-btn px-4 py-2 rounded-lg text-sm font-medium transition-all" data-system="ncs">NCS</button>
                            <button class="color-system-btn px-4 py-2 rounded-lg text-sm font-medium transition-all" data-system="japanese">日本色研</button>
                        </div>
                    </div>
                    
                    <!-- 潘通匹配 -->
                    <div id="pantone-match" class="space-y-4">

                        </div>
                    </div>
                    
                    <!-- RAL匹配 -->

                        <div class="flex items-center gap-4">

                            </div>
                        </div>
                    </div>
                    
                    <!-- NCS匹配 -->

                        <div class="flex items-center gap-4">

                            </div>
                        </div>
                    </div>
                    
                    <!-- 日本色研匹配 -->

                            <div id="japanese-color" class="pantone-swatch w-20 h-20 ceramic-shadow" style="background-color: #FFFFFF;"></div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

            </div>
        </div>
    </div>

            return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? [
                parseInt(result[1], 16),
                parseInt(result[2], 16),
                parseInt(result[3], 16)
            ] : null;

            g /= 255;
            b /= 255;
            
            const k = 1 - Math.max(r, g, b);
            const c = k === 1 ? 0 : (1 - r - k) / (1 - k);
            const m = k === 1 ? 0 : (1 - g - k) / (1 - k);
            const y = k === 1 ? 0 : (1 - b - k) / (1 - k);
            
            return [
                Math.round(c * 100),
                Math.round(m * 100),
                Math.round(y * 100),
                Math.round(k * 100)
            ];
        }

        function cmykToRgb(c, m, y, k) {
            c /= 100;
            m /= 100;
            y /= 100;
            k /= 100;
            
            const r = 255 * (1 - c) * (1 - k);
            const g = 255 * (1 - m) * (1 - k);
            const b = 255 * (1 - y) * (1 - k);
            
            return [
                Math.round(r),
                Math.round(g),
                Math.round(b)
            ];
        }

        // Delta E算法（简化版欧几里得距离）
        function calculateDeltaE(rgb1, rgb2) {
            const dr = rgb1[0] - rgb2[0];
            const dg = rgb1[1] - rgb2[1];
            const db = rgb1[2] - rgb2[2];
            return Math.sqrt(dr * dr + dg * dg + db * db);
        }

        // 查找最接近的颜色
        function findClosestColor(rgb, colorSystem) {
            let colors;
            switch (colorSystem) {
                case 'pantone':
                    colors = pantoneColors;
                    break;
                case 'ral':
                    colors = ralColors;
                    break;
                case 'ncs':
                    colors = ncsColors;
                    break;
                case 'japanese':
                    colors = japaneseColors;
                    break;
                default:
                    colors = pantoneColors;
            }
            
            let closestColor = colors[0];
            let minDistance = calculateDeltaE(rgb, closestColor.rgb);
            
            for (const color of colors) {
                const distance = calculateDeltaE(rgb, color.rgb);
                if (distance< minDistance) {
                    minDistance = distance;
                    closestColor = color;
                }
            }
            
            return closestColor;
        }

        // 更新颜色显示
        function updateColorDisplay(r, g, b) {
            const hex = rgbToHex(r, g, b);
            const cmyk = rgbToCmyk(r, g, b);
            
            // 更新主颜色预览
            mainColorPreview.style.backgroundColor = hex;
            
            // 更新RGB显示
            rgbRValue.textContent = r;
            rgbGValue.textContent = g;
            rgbBValue.textContent = b;
            
            // 更新CMYK输入
            cmykC.value = cmyk[0];
            cmykM.value = cmyk[1];
            cmykY.value = cmyk[2];
            cmykK.value = cmyk[3];
            
            // 更新HEX输入
            hexInput.value = hex;
            
            // 获取当前选中的颜色体系
            const activeSystem = document.querySelector('.color-system-btn.active').dataset.system;
            
            // 查找并显示最接近的颜色
            const closestColor = findClosestColor([r, g, b], activeSystem);
            
            // 根据颜色体系更新显示
            switch (activeSystem) {
                case 'pantone':
                    document.getElementById('pantone-match').classList.remove('hidden');
                    document.getElementById('ral-match').classList.add('hidden');
                    document.getElementById('ncs-match').classList.add('hidden');
                    document.getElementById('japanese-match').classList.add('hidden');
                    document.getElementById('pantone-color').style.backgroundColor = rgbToHex(closestColor.rgb[0], closestColor.rgb[1], closestColor.rgb[2]);
                    document.getElementById('pantone-number').textContent = closestColor.number;
                    document.getElementById('pantone-name').textContent = closestColor.name;
                    break;
                case 'ral':
                    document.getElementById('pantone-match').classList.add('hidden');
                    document.getElementById('ral-match').classList.remove('hidden');
                    document.getElementById('ncs-match').classList.add('hidden');
                    document.getElementById('japanese-match').classList.add('hidden');
                    document.getElementById('ral-color').style.backgroundColor = rgbToHex(closestColor.rgb[0], closestColor.rgb[1], closestColor.rgb[2]);
                    document.getElementById('ral-number').textContent = closestColor.number;
                    document.getElementById('ral-name').textContent = closestColor.name;
                    break;
                case 'ncs':
                    document.getElementById('pantone-match').classList.add('hidden');
                    document.getElementById('ral-match').classList.add('hidden');
                    document.getElementById('ncs-match').classList.remove('hidden');
                    document.getElementById('japanese-match').classList.add('hidden');
                    document.getElementById('ncs-color').style.backgroundColor = rgbToHex(closestColor.rgb[0], closestColor.rgb[1], closestColor.rgb[2]);
                    document.getElementById('ncs-number').textContent = closestColor.number;
                    document.getElementById('ncs-name').textContent = closestColor.name;
                    break;
                case 'japanese':
                    document.getElementById('pantone-match').classList.add('hidden');
                    document.getElementById('ral-match').classList.add('hidden');
                    document.getElementById('ncs-match').classList.add('hidden');
                    document.getElementById('japanese-match').classList.remove('hidden');
                    document.getElementById('japanese-color').style.backgroundColor = rgbToHex(closestColor.rgb[0], closestColor.rgb[1], closestColor.rgb[2]);
                    document.getElementById('japanese-number').textContent = closestColor.number;
                    document.getElementById('japanese-name').textContent = closestColor.name;
                    break;
            }
        }

        // 事件监听器
        rgbR.addEventListener('input', () => {
            const r = parseInt(rgbR.value);
            const g = parseInt(rgbG.value);
            const b = parseInt(rgbB.value);
            updateColorDisplay(r, g, b);
        });

        rgbG.addEventListener('input', () => {
            const r = parseInt(rgbR.value);
            const g = parseInt(rgbG.value);
            const b = parseInt(rgbB.value);
            updateColorDisplay(r, g, b);
        });

        rgbB.addEventListener('input', () => {
            const r = parseInt(rgbR.value);
            const g = parseInt(rgbG.value);
            const b = parseInt(rgbB.value);
            updateColorDisplay(r, g, b);
        });

        cmykC.addEventListener('input', () => {
            const c = parseInt(cmykC.value) || 0;
            const m = parseInt(cmykM.value) || 0;
            const y = parseInt(cmykY.value) || 0;
            const k = parseInt(cmykK.value) || 0;
            const rgb = cmykToRgb(c, m, y, k);
            rgbR.value = rgb[0];
            rgbG.value = rgb[1];
            rgbB.value = rgb[2];
            updateColorDisplay(rgb[0], rgb[1], rgb[2]);
        });

        cmykM.addEventListener('input', () => {
            const c = parseInt(cmykC.value) || 0;
            const m = parseInt(cmykM.value) || 0;
            const y = parseInt(cmykY.value) || 0;
            const k = parseInt(cmykK.value) || 0;
            const rgb = cmykToRgb(c, m, y, k);
            rgbR.value = rgb[0];
            rgbG.value = rgb[1];
            rgbB.value = rgb[2];
            updateColorDisplay(rgb[0], rgb[1], rgb[2]);
        });

        cmykY.addEventListener('input', () => {
            const c = parseInt(cmykC.value) || 0;
            const m = parseInt(cmykM.value) || 0;
            const y = parseInt(cmykY.value) || 0;
            const k = parseInt(cmykK.value) || 0;
            const rgb = cmykToRgb(c, m, y, k);
            rgbR.value = rgb[0];
            rgbG.value = rgb[1];
            rgbB.value = rgb[2];
            updateColorDisplay(rgb[0], rgb[1], rgb[2]);
        });

        cmykK.addEventListener('input', () => {
            const c = parseInt(cmykC.value) || 0;
            const m = parseInt(cmykM.value) || 0;
            const y = parseInt(cmykY.value) || 0;
            const k = parseInt(cmykK.value) || 0;
            const rgb = cmykToRgb(c, m, y, k);
            rgbR.value = rgb[0];
            rgbG.value = rgb[1];
            rgbB.value = rgb[2];
            updateColorDisplay(rgb[0], rgb[1], rgb[2]);
        });

        hexInput.addEventListener('input', () => {
            const hex = hexInput.value;
            const rgb = hexToRgb(hex);
            if (rgb) {
                rgbR.value = rgb[0];
                rgbG.value = rgb[1];
                rgbB.value = rgb[2];
                updateColorDisplay(rgb[0], rgb[1], rgb[2]);
            }
        });

        // 复制潘通色号功能
        // 潘通色块复制功能
        pantoneColor.addEventListener('click', () => {
            const colorNumber = pantoneNumber.textContent;
            navigator.clipboard.writeText(colorNumber).then(() => {
                // 显示复制成功提示
                const originalText = pantoneName.textContent;
                pantoneName.textContent = '已复制！';
                setTimeout(() => {
                    pantoneName.textContent = originalText;
                }, 1500);
            });
        });

        // RAL色块复制功能
        document.getElementById('ral-color').addEventListener('click', () => {
            const colorNumber = document.getElementById('ral-number').textContent;
            navigator.clipboard.writeText(colorNumber).then(() => {
                // 显示复制成功提示
                const originalText = document.getElementById('ral-name').textContent;
                document.getElementById('ral-name').textContent = '已复制！';
                setTimeout(() => {
                    document.getElementById('ral-name').textContent = originalText;
                }, 1500);
            });
        });

        // NCS色块复制功能
        document.getElementById('ncs-color').addEventListener('click', () => {
            const colorNumber = document.getElementById('ncs-number').textContent;
            navigator.clipboard.writeText(colorNumber).then(() => {
                // 显示复制成功提示
                const originalText = document.getElementById('ncs-name').textContent;
                document.getElementById('ncs-name').textContent = '已复制！';
                setTimeout(() => {
                    document.getElementById('ncs-name').textContent = originalText;
                }, 1500);
            });
        });

        // 日本色研色块复制功能
        document.getElementById('japanese-color').addEventListener('click', () => {
            const colorNumber = document.getElementById('japanese-number').textContent;
            navigator.clipboard.writeText(colorNumber).then(() => {
                // 显示复制成功提示
                const originalText = document.getElementById('japanese-name').textContent;
                document.getElementById('japanese-name').textContent = '已复制！';
                setTimeout(() => {
                    document.getElementById('japanese-name').textContent = originalText;
                }, 1500);
            });
        });

        // 显示错误提示
        function showError(message) {
            errorToast.textContent = message;
            errorToast.classList.add('show');
            setTimeout(() => {
                errorToast.classList.remove('show');
            }, 3000);
        }

        // 相机吸色功能
        function startCamera() {
            // 优先使用后置摄像头（exact模式）
            const exactConstraints = {
                video: {
                    facingMode: { exact: 'environment' }
                }
            };
            
            navigator.mediaDevices.getUserMedia(exactConstraints)
                .then(s => {
                    stream = s;
                    initializeCameraStream(s);
                })
                .catch(err => {
                    console.error('无法访问后置摄像头:', err);
                    // 如果exact模式失败，尝试普通的environment模式
                    const fallbackConstraints = {
                        video: {
                            facingMode: 'environment'
                        }
                    };
                    
                    navigator.mediaDevices.getUserMedia(fallbackConstraints)
                        .then(s => {
                            stream = s;
                            initializeCameraStream(s);
                        })
                        .catch(err2 => {
                            console.error('无法访问任何摄像头:', err2);
                            handleCameraError(err2);
                        });
                });
        }

        function initializeCameraStream(s) {
            cameraVideo.srcObject = s;
            cameraContainer.classList.remove('hidden');
            cameraBtn.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                关闭相机
            `;
        }

        function handleCameraError(err) {
            let errorMessage = '无法访问摄像头';
            
            if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                errorMessage = '权限被拒绝，请在浏览器设置中允许访问摄像头';
            } else if (err.name === 'NotFoundError') {
                errorMessage = '未找到可用的摄像头设备';
            } else if (err.name === 'NotReadableError') {
                errorMessage = '摄像头被其他应用占用，请关闭其他应用后重试';
            }
            
            showError(errorMessage);
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            cameraContainer.classList.add('hidden');
            cameraBtn.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                开启相机吸色
            `;
        }

        function captureColor() {
            try {
                const videoWidth = cameraVideo.videoWidth;
                const videoHeight = cameraVideo.videoHeight;
                
                if (videoWidth === 0 || videoHeight === 0) {
                    showError('相机画面未就绪，请稍后再试');
                    return;
                }
                
                cameraCanvas.width = videoWidth;
                cameraCanvas.height = videoHeight;
                
                const ctx = cameraCanvas.getContext('2d');
                ctx.drawImage(cameraVideo, 0, 0, videoWidth, videoHeight);
                
                // 获取画面中心的颜色
                const centerX = Math.floor(videoWidth / 2);
                const centerY = Math.floor(videoHeight / 2);
                
                const pixelData = ctx.getImageData(centerX, centerY, 1, 1).data;
                const r = pixelData[0];
                const g = pixelData[1];
                const b = pixelData[2];
                
                // 更新颜色显示
                rgbR.value = r;
                rgbG.value = g;
                rgbB.value = b;
                updateColorDisplay(r, g, b);
                
                // 显示捕获成功提示
                const originalText = cameraBtn.innerHTML;
                cameraBtn.innerHTML = '<span>颜色已捕获！</span>';
                setTimeout(() => {
                    cameraBtn.innerHTML = originalText;
                }, 1500);
            } catch (err) {
                console.error('捕获颜色失败:', err);
                showError('捕获颜色失败，请重试');
            }
        }

        // 权限请求处理
        function showPermissionModal() {
            permissionModal.classList.remove('hidden');
        }

        function hidePermissionModal() {
            permissionModal.classList.add('hidden');
        }

        // 相机按钮点击事件
        cameraBtn.addEventListener('click', () => {
            if (stream) {
                stopCamera();
            } else {
                // 显示权限请求弹窗
                showPermissionModal();
            }
        });

        // 权限按钮点击事件
        permissionAllow.addEventListener('click', () => {
            hidePermissionModal();
            startCamera();
        });

        permissionDeny.addEventListener('click', () => {
            hidePermissionModal();
        });

        // 捕获颜色按钮点击事件
        captureBtn.addEventListener('click', captureColor);

        // 重置功能
        function resetColor() {
            // 重置为白色
            updateColorDisplay(255, 255, 255);
            
            // 如果相机正在运行，关闭相机
            if (stream) {
                stopCamera();
            }
            
            // 显示重置成功提示
            const originalText = resetBtn.innerHTML;
            resetBtn.innerHTML = '<span>已重置！</span>';
            setTimeout(() => {
                resetBtn.innerHTML = originalText;
            }, 1500);
        }

        // 重置按钮点击事件
        resetBtn.addEventListener('click', resetColor);

        // 颜色体系切换事件
        const colorSystemBtns = document.querySelectorAll('.color-system-btn');
        colorSystemBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // 移除所有按钮的active状态
                colorSystemBtns.forEach(b => b.classList.remove('active'));
                // 添加当前按钮的active状态
                btn.classList.add('active');
                // 更新颜色显示
                const r = parseInt(rgbR.value);
                const g = parseInt(rgbG.value);
                const b = parseInt(rgbB.value);
                updateColorDisplay(r, g, b);
            });
        });

        // 初始化
        updateColorDisplay(255, 255, 255);
    </script>
</body>
